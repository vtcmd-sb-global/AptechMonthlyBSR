name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        run: python -m PyInstaller --clean --noconfirm AptechMonthlyBSR.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AptechMonthlyBSR/AptechMonthlyBSR.exe")) {
            throw "PyInstaller did not produce the expected executable."
          }

      - name: Upload distributable application
        uses: actions/upload-artifact@v4
        with:
          name: AptechMonthlyBSR-Windows
          path: dist/AptechMonthlyBSR/
          if-no-files-found: error
